# ⚓ TS-Λ3 // WEBSITE SMOKE TEST & DEPLOY [v2.0.0-WIF]
# Path: .github/workflows/deploy.yml
# Mission: Automated Production Strike via GitHub Actions (WIF-only)
# Authority: THE OVERWATCH // SG-CANONICAL-2026

name: Website Smoke Test & Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: 🧬 Checkout Substrate
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js (LTS 20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛡️ Substrate Verify & Build
        run: npm run verify

      - name: 🔐 Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: ⚙️ Install Firebase CLI
        run: npm install -g firebase-tools

      - name: 🚀 Authoritative Production Strike (firebase-tools)
        run: |
          firebase deploy --only hosting:rpr-corporate-site --project rpr-corporate-site
