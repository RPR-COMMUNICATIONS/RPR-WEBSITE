# ⚓ TS-Λ3 // WEBSITE SMOKE TEST & DEPLOY [v1.1.3]
# Path: .github/workflows/deploy.yml
# Mission: Automated Production Strike via GitHub Actions
# Authority: THE OVERWATCH // SG-CANONICAL-2026

name: Website Smoke Test & Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🧬 Checkout Substrate
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js (LTS 20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        # Using 'ci' for faster, immutable dependency resolution in runners
        run: npm ci

      - name: 🛡️ Substrate Verify & Build
        # Triggers local-validate, safe-smallcaps-latch, and tsc automatically
        run: npm run verify

      - name: 🚀 Authoritative Production Strike
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          projectId: rpr-corporate-site
          channelId: live
